name: CI

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'   # nightly 02:00 UTC
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false # Disabled for now to avoid cache issues between jobs

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run tests
        run: go test -v ./...

  e2e:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Below the 6h hard limit for GitHub-hosted runners: a job that hits the platform limit
    # is *cancelled*, which skips the diagnostics steps below and leaves nothing to look at.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        version: ["7.0", "6.1", "6.0", "5.1"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Map e2e hosts to localhost
        run: |
          v=$(echo "${{ matrix.version }}" | tr -d '.')
          for t in project bundle; do
            echo "127.0.0.1 oro-$t-$v.e2e.test" | sudo tee -a /etc/hosts
          done

      - name: Build orobox
        run: make build

      - name: Disk, memory and Docker state before e2e
        run: |
          df -h /
          free -m
          docker system df

      - name: Run e2e (version ${{ matrix.version }})
        env:
          OROBOX_BIN: ${{ github.workspace }}/orobox
          E2E_VERSIONS: ${{ matrix.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tee each orobox invocation to the job log as it runs. Without this the harness
          # only reports a step once it returns, so a long or stalled install shows nothing
          # at all in the log.
          E2E_STREAM: "1"
          # Bound one orobox invocation, so a stall fails that step (with whatever it had
          # printed) instead of eating the whole -timeout and being killed with no output.
          E2E_STEP_TIMEOUT: 90m
          # Where the harness writes one log per orobox invocation plus each case's generated
          # compose and env files. The Upload logs step archives exactly this directory.
          E2E_LOG_DIR: ${{ runner.temp }}/orobox-e2e-logs
        # Must stay under the job timeout-minutes above, so the panic and its goroutine dump
        # are actually emitted.
        run: go test -tags e2e -timeout 4h -v ./e2e/...

      - name: Docker diagnostics
        if: always()
        run: |
          df -h /
          free -m
          # An OOM kill inside a container surfaces to the application only as
          # `signal "9"`, with nothing in the job log saying which process was chosen or what
          # its cgroup limit was. These two make the next occurrence self-explanatory.
          sudo dmesg | grep -iE "out of memory|oom-kill|killed process" | tail -20 || echo "no OOM kills in dmesg"
          docker system df
          docker ps -a
          for c in $(docker ps -aq); do
            echo "=== $(docker inspect --format '{{.Name}} {{.State.Status}} {{.State.ExitCode}}' "$c") ==="
            docker logs --tail 200 "$c" 2>&1 || true
          done

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.version }}
          # Must stay in step with E2E_LOG_DIR above. The previous value, /tmp/orobox*.log,
          # was a path the harness never wrote, so every run of this job reported "No files
          # were found with the provided path" and produced no artifact at all.
          path: ${{ runner.temp }}/orobox-e2e-logs
          if-no-files-found: warn

  release:
    needs: [lint, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: absent (empty string) when the tap repos aren't set up yet. The
          # homebrew_casks/scoops blocks in .goreleaser.yaml turn their own upload off in
          # that case, so a missing secret does not fail the release.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

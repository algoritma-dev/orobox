volumes:
  pg_data_test:

services:
  db-test:
    image: "postgres:{{.PostgresVersion}}"
    command: [ "postgres", "-c", "max_locks_per_transaction=1024" ]
    env_file:
      - .env.test
    labels:
      com.symfony.server.service-prefix: ORO_DB
    ports:
      - "5433:5432"
    # Same reasoning as the dev db: EnsureServicesRunning reads this service's health out of
    # `docker compose ps`, so the interval is how long it can report "starting" for a server
    # that is already accepting.
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 60s
    restart: unless-stopped
    {{if .UseTmpfs -}}
    tmpfs:
      - /var/lib/postgresql/data:size={{.TmpfsSize}}
    volumes:
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    {{else}}
    volumes:
      - pg_data_test:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    {{end}}

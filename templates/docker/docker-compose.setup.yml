x-templates:
  oro-app: &oro-app
    image: "algoritmadev/orobox:{{.OroVersion}}-{{.ImageSuffix}}-latest"
    env_file: .env
    extra_hosts:
      - "host.docker.internal:host-gateway"

  volumes-setup: &volumes-setup
    {{if .BindWholeRepo -}}
    - "{{.BundlePath}}:{{.OroRootDir}}:cached"
    {{- else -}}
    - "oro_app:{{.OroRootDir}}:delegated"
    - "{{.BundlePath}}:{{.BundleRootContainerPath}}:cached"
    - "{{.BundlePath}}/vendor-oro:{{.OroRootDir}}/vendor:delegated"
    {{- end}}
    - "cache:{{.OroRootDir}}/var/cache:delegated"
    - "public_storage:{{.OroRootDir}}/public/media:delegated"
    - "private_storage:{{.OroRootDir}}/var/data:delegated"

services:
  volume-setup:
    <<: *oro-app
    profiles: [setup]
    user: root
    command:
      - bash
      - -c
      - |
        echo "Initializing volumes and permissions for ${ORO_USER_RUNTIME:-www-data}..."
        echo "Clearing stale cache before installation..."
        rm -rf var/cache/* 2>/dev/null || true
        mkdir -p bin config public src templates translations var assets var/cache var/logs var/data public/media
        {{if .SyncsVendorToHost -}}
        if [ -d /vendor-host ] && [ -z "$(ls -A /vendor-host)" ]; then
            echo "Populating vendor folder on host from container..."
            cp -rp {{.OroRootDir}}/vendor/. /vendor-host/
        fi
        {{end -}}
        {{if .RunsComposerInstall -}}
        echo "Installing project dependencies via composer install..."
        COMPOSER_ALLOW_SUPERUSER=1 composer install --no-interaction --no-scripts
        {{end -}}
        {{if .RunsComposerRequire -}}
        if [ -n "{{.BundlePackageName}}" ]; then
            echo "Configuring bundle {{.BundlePackageName}} as path repository..."
            # Configure composer repository for the bundle
            # Use relative path from {{.OroRootDir}} to the bundle root
            COMPOSER_ALLOW_SUPERUSER=1 composer config repositories.bundle '{"type": "path", "url": "bundles/{{.BundleNamespace}}", "options": {"symlink": true}}'
            # Require the bundle package
            # We use --no-scripts to avoid running OroCommerce scripts too early
            COMPOSER_ALLOW_SUPERUSER=1 composer require "{{.BundlePackageName}}:@dev" --no-interaction --no-scripts
            if [ -d /vendor-host ]; then
                echo "Syncing newly installed bundle to host vendor folder..."
                cp -rp {{.OroRootDir}}/vendor/. /vendor-host/
            fi
        fi
        {{end -}}
        chown -R ${ORO_USER_RUNTIME:-www-data} . bin config public src templates translations var assets var/cache var/logs var/data public/media 2>/dev/null || true
        [ -d /vendor-host ] && chown -R ${ORO_USER_RUNTIME:-www-data} /vendor-host 2>/dev/null || true
        chmod -R 777 var/cache var/logs var/data 2>/dev/null || true
        true
    environment:
      ORO_XDEBUG_ENABLED: "false"
    volumes:
    {{if .BindWholeRepo -}}
    - "{{.BundlePath}}:{{.OroRootDir}}:cached"
    {{- else -}}
    - "oro_app:{{.OroRootDir}}:delegated"
    - "{{.BundlePath}}:{{.BundleRootContainerPath}}:cached"
    {{- end}}
    {{if .SyncsVendorToHost -}}
    - "{{.BundlePath}}/vendor-oro:/vendor-host:delegated"
    {{end -}}
    - "cache:{{.OroRootDir}}/var/cache:delegated"
    - "public_storage:{{.OroRootDir}}/public/media:delegated"
    - "private_storage:{{.OroRootDir}}/var/data:delegated"

  install:
    <<: *oro-app
    profiles: [setup]
    command: install ${ORO_INSTALL_OPTIONS}
    user: ${ORO_USER_RUNTIME:-www-data}
    environment:
      ORO_SAMPLE_DATA: ${ORO_SAMPLE_DATA:-y}
      ORO_XDEBUG_ENABLED: ${ORO_INSTALL_XDEBUG_ENABLED:-false}
    depends_on:
      "volume-setup":
        condition: service_completed_successfully
      "gotenberg":
        condition: service_healthy
      {{if .Postgres -}}
      "db":
        condition: service_healthy
      {{- end}}
      {{if .Mailpit -}}
      "mail":
        condition: service_started
      {{- end}}
      {{if .Redis -}}
      "redis":
        condition: service_healthy
      {{- end}}
      {{if .RabbitMQ -}}
      "rabbitmq":
        condition: service_started
      {{- end}}
      {{if .Elasticsearch -}}
      "elasticsearch":
        condition: service_started
      {{- end}}
    volumes: *volumes-setup

  gotenberg:
    image: gotenberg/gotenberg:8.23.2
    # The install depends on this with condition: service_healthy, and an unset interval
    # means Docker's 30s default before the first probe ever runs.
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3000/health" ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 30s
    restart: on-failure


x-templates:
  oro-app: &oro-app
    image: "algoritmadev/orobox:{{.OroVersion}}-{{.ImageSuffix}}-latest"
    mem_limit: ${ORO_APP_MEM_LIMIT:-2g}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Websocket wiring belongs to Orobox, not to the project's own dotenv: the server runs as
  # the "ws" service on the compose network, and the browser reaches it through the nginx
  # port published on the host. Injected as environment (not env_file) so it also overrides
  # the addresses a project checkout carries in its own dotenv files.
  websocket-env: &websocket-env
    ORO_WEBSOCKET_SERVER_DSN: "//0.0.0.0:{{.WebsocketBackendPort}}"
    ORO_WEBSOCKET_BACKEND_DSN: "tcp://{{.WebsocketBackendHost}}:{{.WebsocketBackendPort}}"
    ORO_WEBSOCKET_FRONTEND_DSN: "//*:{{.WebsocketFrontendPort}}/ws"

  volumes-oro: &volumes-oro
    {{if .BindWholeRepo -}}
    - "{{.BundlePath}}:{{.OroRootDir}}:cached"
    {{- else -}}
    - "oro_app:{{.OroRootDir}}:delegated"
    - "{{.BundlePath}}:{{.BundleRootContainerPath}}:cached"
    - "{{.BundlePath}}/vendor-oro:{{.OroRootDir}}/vendor:delegated"
    {{- end}}
    - "cache:{{.OroRootDir}}/var/cache:delegated"
    - "public_storage:{{.OroRootDir}}/public/media:delegated"
    - "private_storage:{{.OroRootDir}}/var/data:delegated"
    {{if .MountsEnvFiles -}}
    # Sources are relative to the project directory, which GetBaseComposeArgs points at the
    # internal directory — the same resolution `env_file: .env` relies on in the setup file.
    # Naming the internal directory here as well resolved to <internal>/<internal>/.env, and a
    # missing bind source makes Docker mount an empty directory instead: Symfony's Dotenv then
    # skips .env-app.local and the container silently falls back to Oro's own .env-app.
    - "./.env:{{.OroRootDir}}/.env-app.local:cached"
    - "./.env.test:{{.OroRootDir}}/.env-app.test:cached"
    {{- end}}
    {{if .SSHAgentSocket -}}
    # Forwarded host SSH agent, so composer/git over SSH work inside the running stack.
    # A YAML merge key cannot extend a sequence, so the mount goes in the shared anchor:
    # the services that never run git simply carry an unused socket.
    - "{{.SSHAgentSocket}}:/ssh-agent"
    {{- end}}

services:
  application:
    <<: *oro-app
    user: ${ORO_USER_RUNTIME:-www-data}
    # This is the container that runs composer install, oro:install and oro:assets:build, so
    # it gets the headroom the long-running services do not need: webpack's production build
    # is the memory peak of the whole installation.
    mem_limit: ${ORO_BUILD_MEM_LIMIT:-{{.BuildMemoryLimit}}}
    environment:
      # Node sizes its default heap from the host's RAM, not from the container's cgroup
      # limit, so on a machine with plenty of memory webpack grows straight past mem_limit
      # and the cgroup OOM killer takes it out. oro:assets:build reports that as
      # `The process has been signaled with signal "9"` — and never as "JavaScript heap out
      # of memory", because node never reached a limit of its own. Telling node the budget
      # makes it collect within it, and turns the remaining overflow into a clean error.
      NODE_OPTIONS: --max-old-space-size=${ORO_NODE_HEAP_MB:-{{.NodeHeapMB}}}
      {{- if .SSHAgentSocket}}
      # accept-new avoids an interactive host-key prompt on first connect, and the known-hosts
      # file lives in /tmp so the write never needs a writable $HOME. HOME itself is left alone:
      # a long-running service keeps the home directory its image gives it.
      SSH_AUTH_SOCK: /ssh-agent
      GIT_SSH_COMMAND: ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts
      {{- end}}
    command:
      - bash
      - -c
      - |
        echo "Application is running..."
        {{range .Domains -}}
        echo "Listen on: {{if .Ssl}}https://{{.Host}}{{if ne $.NginxHTTPSPort "443"}}:{{$.NginxHTTPSPort}}{{end}}{{else}}http://{{.Host}}{{if ne $.NginxHTTPPort "80"}}:{{$.NginxHTTPPort}}{{end}}{{end}}/"
        {{else -}}
        echo "Listen on: $${ORO_APP_PROTOCOL}://$${ORO_APP_DOMAIN}{{if and (ne .NginxHTTPPort "80") (ne .NginxHTTPPort "443")}}:{{.NginxHTTPPort}}{{end}}/"
        {{end -}}
        exec tail -f /dev/null
    volumes: *volumes-oro
    depends_on:
      "web":
        condition: service_started
      "consumer":
        condition: service_started
      "cron":
        condition: service_started

  web:
    <<: *oro-app
    environment:
      ORO_XDEBUG_ENABLED: "false"
    command: nginx
    restart: unless-stopped
    healthcheck:
      test: "curl -If http://127.0.0.1:80/"
      interval: 15s
      timeout: 30s
      start_period: 15s
    ports:
      - published: "{{.NginxHTTPPort}}"
        target: 80
      {{if .HasSsl -}}
      - published: "{{.NginxHTTPSPort}}"
        target: 443
      {{- end}}
    depends_on:
      "web-init":
        condition: service_completed_successfully
      "php-fpm-app":
        condition: service_healthy
    tmpfs:
      - /opt/oro-nginx
    volumes:
      - "./nginx.conf:/etc/nginx/http.d/default.conf:ro"
      {{if .BindWholeRepo -}}
      - "{{.BundlePath}}:{{.OroRootDir}}:cached"
      {{- else -}}
      - "oro_app:{{.OroRootDir}}:delegated"
      - "{{.BundlePath}}:{{.BundleRootContainerPath}}:cached"
      - "{{.BundlePath}}/vendor-oro:{{.OroRootDir}}/vendor:delegated"
      {{- end}}
      - "cache:{{.OroRootDir}}/var/cache:ro"
      - "public_storage:{{.OroRootDir}}/public/media:ro"
      - "private_storage:{{.OroRootDir}}/var/data:ro"
      {{if .HasSsl -}}
      - "{{.CertsPath}}:/etc/nginx/certs:ro"
      {{- end}}

  volume-init:
    <<: *oro-app
    user: root
    profiles: [setup]
    command:
      - bash
      - -c
      - |
        echo "Initializing volumes and permissions for ${ORO_USER_RUNTIME:-www-data}..."
        mkdir -p bin config public src templates translations var assets var/cache var/logs var/data public/media
        {{if .SyncsVendorToHost -}}
        if [ -d /vendor-host ] && [ -z "$$(ls -A /vendor-host)" ]; then
            echo "Populating vendor folder on host from container..."
            cp -rp {{.OroRootDir}}/vendor/. /vendor-host/
        fi
        {{end -}}
        chown -R ${ORO_USER_RUNTIME:-www-data} . bin config public src templates translations var assets var/cache var/logs var/data public/media 2>/dev/null || true
        [ -d /vendor-host ] && chown -R ${ORO_USER_RUNTIME:-www-data} /vendor-host 2>/dev/null || true
        chmod -R 777 var/cache var/logs var/data 2>/dev/null || true
        true
    environment:
      ORO_XDEBUG_ENABLED: "false"
    volumes:
      {{if .BindWholeRepo -}}
      - "{{.BundlePath}}:{{.OroRootDir}}:cached"
      {{- else -}}
      - "oro_app:{{.OroRootDir}}:delegated"
      - "{{.BundlePath}}:{{.BundleRootContainerPath}}:cached"
      {{- end}}
      {{if .SyncsVendorToHost -}}
      - "{{.BundlePath}}/vendor-oro:/vendor-host:delegated"
      {{end -}}
      - "cache:{{.OroRootDir}}/var/cache:delegated"
      - "public_storage:{{.OroRootDir}}/public/media:delegated"
      - "private_storage:{{.OroRootDir}}/var/data:delegated"

  web-init:
    <<: *oro-app
    command:
      - bash
      - -c
      - |
        echo "$$(jq '.properties.sites.propertyNames.pattern = ".*"' /opt/oro-nginx-tool/variables.schema.json 2>/dev/null || echo "{}")" > /opt/oro-nginx-tool/variables.schema.json 2>/dev/null || true
        /usr/local/bin/docker-entrypoint.sh nginx-init && sed -i '/gridfs/d; /mongo/d' /opt/oro-nginx/etc/sites-available/*.conf || true
    environment:
      ORO_XDEBUG_ENABLED: "false"
    depends_on:
      "php-fpm-app":
        condition: service_healthy
      "ws":
        condition: service_started
    tmpfs:
      - /opt/oro-nginx

  php-fpm-app:
    <<: *oro-app
    command: php-fpm
    restart: unless-stopped
    user: ${ORO_USER_RUNTIME:-www-data}
    environment:
      <<: *websocket-env
    # web waits on this with condition: service_healthy. retries is explicit because the
    # default is 3, which at a 5s interval tolerates only 15s of failing probes.
    healthcheck:
      test: ["CMD", "php-fpm", "-t"]
      interval: 5s
      timeout: 30s
      retries: 18
      start_period: 15s
    depends_on:
      {{if .Postgres -}}
      "db":
        condition: service_healthy
      {{- end}}
      {{if .Mailpit -}}
      "mail":
        condition: service_started
      {{- end}}
      {{if .Redis -}}
      "redis":
        condition: service_healthy
      {{- end}}
      {{if .RabbitMQ -}}
      "rabbitmq":
        condition: service_healthy
      {{- end}}
      {{if .Elasticsearch -}}
      "elasticsearch":
        condition: service_healthy
      {{- end}}
    volumes: *volumes-oro

  ws:
    <<: *oro-app
    command: websocket
    restart: unless-stopped
    user: ${ORO_USER_RUNTIME:-www-data}
    init: true
    # The websocket server is a long-running console command: without .env it gets an
    # empty ORO_ENV and dies on "the environment cannot be empty" in a restart loop.
    env_file:
      - .env
    environment:
      <<: *websocket-env
      ORO_XDEBUG_ENABLED: ${ORO_WS_XDEBUG_ENABLED:-false}
    expose:
      - "{{.WebsocketBackendPort}}"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 {{.WebsocketBackendPort}}"]
      interval: 15s
      timeout: 5s
      start_period: 30s
    depends_on:
      "php-fpm-app":
        condition: service_healthy
    volumes: *volumes-oro

  consumer:
    <<: *oro-app
    command: consumer
    restart: unless-stopped
    user: ${ORO_USER_RUNTIME:-www-data}
    init: true
    env_file:
      - .env
    environment:
      <<: *websocket-env
      ORO_XDEBUG_ENABLED: ${ORO_CONSUMER_XDEBUG_ENABLED:-false}
    depends_on:
      "php-fpm-app":
        condition: service_healthy
    volumes: *volumes-oro

  cron:
    <<: *oro-app
    user: ${ORO_USER_RUNTIME:-www-data}
    command: cron
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1024
        hard: 1048576
    env_file:
      - .env
    environment:
      <<: *websocket-env
      ORO_XDEBUG_ENABLED: ${ORO_CRON_XDEBUG_ENABLED:-false}
    volumes: *volumes-oro
    depends_on:
      "php-fpm-app":
        condition: service_healthy
      {{- if .Postgres}}
      "db":
        condition: service_healthy
      {{- end}}

  {{if .Postgres}}
  db:
    image: "postgres:{{.PostgresVersion}}"
    command: ["postgres", "-c", "max_locks_per_transaction=1024"]
    labels:
      com.symfony.server.service-prefix: ORO_DB
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${ORO_DB_NAME:-oro_db}
      POSTGRES_USER: ${ORO_DB_USER:-oro_db_user}
      POSTGRES_PASSWORD: ${ORO_DB_PASSWORD:-oro_db_pass}
      POSTGRES_ROOT_PASSWORD: ${ORO_DB_ROOT_PASSWORD:-oro_db_pass}
    # Probed every 2s, not on Docker's 30s default: the first probe is what releases every
    # `condition: service_healthy` dependency, and Postgres is normally accepting within a
    # second or two of the container starting. retries preserves the old failure budget —
    # 45 x 2s is the same 90s after start_period that the default 3 x 30s allowed, which a
    # cold initdb on a loaded runner can still need.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 60s
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
  {{end}}
  {{if .Redis}}
  redis:
    image: "redis:{{.RedisVersion}}"
    hostname: redis
    ports:
      - "6379:6379"
    # php-fpm-app waits on this with condition: service_healthy. See db for why the interval
    # is short and retries are sized to the startup a loaded runner can need.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 30s
    restart: unless-stopped
  {{end}}
  {{if .RedisInsight}}
  redisinsight:
    image: redis/redisinsight:latest
    ports:
      - "8001:5540"
    restart: unless-stopped
    depends_on:
      - redis
  {{end}}
  {{if .Mailpit}}
  mail:
    image: axllent/mailpit:latest
    hostname: mail
    ports:
      - "8025:8025"
      - "2025:1025"
    restart: unless-stopped
  {{end}}
  {{if .RabbitMQ}}
  rabbitmq:
    image: "rabbitmq:{{.RabbitMQVersion}}"
    hostname: rabbitmq
    restart: unless-stopped
    # php-fpm-app waits on this with condition: service_healthy, and the broker takes a while
    # to accept: a long interval delays every dependent start, a small retry count fails a
    # slow one. See db.
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 60s
    ports:
      {{if true -}}
      - "15672:15672"
      {{- end}}
      - "5672:5672"
    environment:
      RABBITMQ_DEFAULT_USER: ${ORO_RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${ORO_RABBITMQ_PASS:-guest}
  {{end}}
  {{if .Elasticsearch}}
  elasticsearch:
    image: "elasticsearch:{{.ElasticsearchVersion}}"
    hostname: elasticsearch
    restart: unless-stopped
    # kibana waits on this with condition: service_healthy, and a single-node cluster is the
    # slowest starter here — it had the tightest budget of all: 5 retries at 10s and no
    # start_period, so 50s total. See db.
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health?local=true || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 60s
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - cluster.routing.allocation.disk.threshold_enabled=false
      - "ES_JAVA_OPTS=-Xms${ORO_ES_MEM_LIMIT:-512m} -Xmx${ORO_ES_MEM_LIMIT:-512m}"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
  {{end}}
  gotenberg:
    image: gotenberg/gotenberg:8.23.2
    ports:
      - "3000:3000"
    # See db: the install waits on this one with condition: service_healthy, so leaving the
    # interval unset put Docker's 30s default in front of every `orobox init`.
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://127.0.0.1:3000/health" ]
      interval: 2s
      timeout: 5s
      retries: 45
      start_period: 30s
    restart: on-failure
  {{if .Adminer}}
  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    restart: unless-stopped
    depends_on:
      - db
  {{end}}
  {{if .Kibana}}
  kibana:
    image: "kibana:{{.ElasticsearchVersion}}"
    ports:
      - "5601:5601"
    restart: unless-stopped
    depends_on:
      "elasticsearch":
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: "http://elasticsearch:9200"
      XPACK_SECURITY_ENABLED: "false"
      XPACK_ENCRYPTED_SAVED_OBJECTS_ENCRYPTION_KEY: "a-32-character-minimum-encryption-key-for-kibana"
  {{end}}

volumes:
  oro_app:
  cache:
  public_storage:
  private_storage:
  pg_data:
  es_data:
